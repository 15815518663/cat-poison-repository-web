<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猫盾安全卫士 · 病毒库</title>
  <style>
    :root{font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#20394d;background:#eef8ff}
    body{max-width:980px;margin:0 auto;padding:28px 18px}
    header,.card{background:#fff;border:1px solid #d4e8f6;border-radius:16px;padding:20px;margin-bottom:18px}
    h1{color:#347fa9;margin:0 0 8px}
    .muted{color:#58758b;line-height:1.7}
    .pill{display:inline-block;background:#e8f5ff;border-radius:99px;padding:5px 11px}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e4eef5;word-break:break-all}
    th{color:#58758b}
    code{font-size:.88em}
    a{color:#2876a8}
    @media(max-width:650px){table{font-size:.82rem}th,td{padding:8px 4px}}
  </style>
</head>
<body>
  <header>
    <h1>🐱 猫盾安全卫士病毒库</h1>
    <div class="muted">只发布经维护者审核的 SHA-256 特征。GitHub Pages 是静态托管，不能在网页上直接保存审批或接收客户端上传。</div>
  </header>
  <section class="card">
    <span class="pill">已批准特征：<strong id="count">0</strong></span>
    <span class="pill">版本：<strong id="version">读取中</strong></span>
    <p class="muted">请通过 GitHub Issues 提交待审摘要；维护者核实后再更新 <code>virus-db.json</code>。仅凭文件哈希无法证明文件恶意，避免提交个人文件的哈希或敏感信息。</p>
    <p><a href="https://github.com/15815518663/cat-poison-repository-web/issues/new?title=%E7%89%B9%E5%BE%81%E5%AE%A1%E6%A0%B8%E7%94%B3%E8%AF%B7">打开人工审核提交页面</a> · <a href="https://github.com/15815518663/cat-poison-repository-web">查看仓库</a></p>
  </section>
  <section class="card">
    <h2>已批准的特征</h2>
    <table>
      <thead><tr><th>名称</th><th>SHA-256</th><th>风险</th><th>审核来源</th></tr></thead>
      <tbody id="entries"><tr><td colspan="4">正在加载…</td></tr></tbody>
    </table>
    <p id="error" class="muted" role="status"></p>
  </section>
  <script>
    const databaseUrl = new URL("./virus-db.json", window.location.href);
    databaseUrl.searchParams.set("_", Date.now().toString());
    fetch(databaseUrl, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((database) => {
        if (!Array.isArray(database.signatures)) throw new Error("病毒库格式无效");
        const approved = database.signatures.filter((entry) =>
          entry && entry.status === "approved" && /^[a-f0-9]{64}$/i.test(entry.hash || "")
        );
        document.getElementById("count").textContent = String(approved.length);
        document.getElementById("version").textContent = String(database.version || "未知");
        const body = document.getElementById("entries");
        body.replaceChildren();
        if (approved.length === 0) {
          const row = body.insertRow();
          const cell = row.insertCell();
          cell.colSpan = 4;
          cell.textContent = "目前没有已批准特征。";
          return;
        }
        for (const entry of approved) {
          const row = body.insertRow();
          for (const value of [entry.name || "未命名", entry.hash, entry.severity || "未评级", entry.source || "维护者审核"]) {
            const cell = row.insertCell();
            if (value === entry.hash) {
              const code = document.createElement("code");
              code.textContent = value;
              cell.append(code);
            } else {
              cell.textContent = value;
            }
          }
        }
      })
      .catch((error) => {
        document.getElementById("entries").replaceChildren();
        document.getElementById("error").textContent = `无法加载病毒库：${error.message}`;
      });
  </script>
</body>
</html>
