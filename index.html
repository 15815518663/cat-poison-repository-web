<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猫盾病毒库审核站</title>
  <style>
    :root {
      --bg: #eef8ff;
      --panel: #ffffff;
      --primary: #3d88bf;
      --text: #1d3752;
      --muted: #6c879a;
      --danger: #d55a5a;
      --warn: #d69c3d;
      --ok: #5ba86a;
      --border: #d7eaf8;
    }
    body { margin:0; font-family:'Microsoft YaHei','Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width: 1100px; margin:0 auto; padding:28px 20px 60px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; }
    h1 { margin:0; font-size:2.2rem; }
    .badge { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:999px; padding:8px 14px; color:var(--muted); }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow:0 8px 20px rgba(54,103,146,.06); padding:20px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin:22px 0; }
    .stat { padding:16px 18px; border-radius:14px; border:1px solid var(--border); background:linear-gradient(180deg,#f7fbff,#edf7ff); }
    .stat .label { color:var(--muted); font-size:0.85rem; }
    .stat .value { font-size:2rem; font-weight:700; margin-top:8px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:600; }
    .pill { display:inline-block; padding:4px 8px; border-radius:999px; font-size:0.78rem; }
    .high { background:#ffeaea; color:var(--danger); }
    .medium { background:#fff3d9; color:var(--warn); }
    .low { background:#eafaf0; color:var(--ok); }
    .actions { display:flex; gap:8px; }
    button { border:none; border-radius:10px; padding:8px 12px; cursor:pointer; font-weight:600; }
    .approve { background:#e5f7eb; color:#1f7e43; }
    .reject { background:#ffeded; color:#b24949; }
    .meta { color:var(--muted); font-size:0.85rem; }
    .log { white-space:pre-wrap; background:#f7fbff; border:1px solid var(--border); border-radius:12px; padding:14px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="badge">🐱 猫盾病毒库审核站</div>
        <h1>智能恶意程序特征库与人工批准中心</h1>
      </div>
      <div class="badge">GitHub Pages · 公开审核入口</div>
    </header>

    <section class="grid">
      <div class="card stat">
        <div class="label">已批准特征</div>
        <div class="value" id="approvedCount">0</div>
      </div>
      <div class="card stat">
        <div class="label">待审核</div>
        <div class="value" id="pendingCount">0</div>
      </div>
      <div class="card stat">
        <div class="label">源码地址</div>
        <div class="value" id="repoTag">GitHub Pages</div>
      </div>
    </section>

    <section class="card">
      <h2>病毒库</h2>
      <div class="meta">该页面用于显示程序请求的远程病毒库，所有“已批准/已拒绝”结果都需要管理员人工审核后再更新 JSON 文件。</div>
      <table>
        <thead>
          <tr><th>特征名</th><th>哈希</th><th>风险</th><th>来源</th><th>状态</th><th>审批</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <section class="card" style="margin-top:22px;">
      <h2>审核日志</h2>
      <div id="logBox" class="log">正在读取病毒库…</div>
    </section>
  </div>

  <script>
    const remoteUrl = './virus-db.json';
    const stateKey = 'catshield-review-state';

    function readState() {
      try {
        return JSON.parse(localStorage.getItem(stateKey) || '{}');
      } catch (error) {
        return {};
      }
    }

    function writeState(next) {
      localStorage.setItem(stateKey, JSON.stringify(next));
    }

    function severityClass(value) {
      const v = (value || '').toLowerCase();
      if (v.includes('high')) return 'high';
      if (v.includes('medium')) return 'medium';
      return 'low';
    }

    function render(items) {
      const approved = items.filter(item => item.status === 'approved').length;
      const pending = items.filter(item => item.status === 'pending').length;
      document.getElementById('approvedCount').textContent = String(approved);
      document.getElementById('pendingCount').textContent = String(pending);

      const rows = items.map((item) => {
        const state = item.status || 'pending';
        const action = `
          <div class="actions">
            <button class="approve" data-action="approve" data-id="${item.id}">批准</button>
            <button class="reject" data-action="reject" data-id="${item.id}">拒绝</button>
          </div>
        `;
        return `<tr>
          <td>${item.name}</td>
          <td><code>${item.hash}</code></td>
          <td><span class="pill ${severityClass(item.severity)}">${item.severity || 'low'}</span></td>
          <td>${item.source || '人工提交'}</td>
          <td>${state}</td>
          <td>${action}</td>
        </tr>`;
      }).join('');
      document.getElementById('tableBody').innerHTML = rows;

      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const decision = button.dataset.action;
          const id = button.dataset.id;
          const state = readState();
          state[id] = decision === 'approve' ? 'approve' : 'reject';
          writeState(state);
          fetch(remoteUrl)
            .then(r => r.json())
            .then((data) => {
              const nextItems = (data.signatures || []).map((item) => {
                const itemId = item.id || '';
                const currentDecision = state[itemId];
                const nextStatus = currentDecision === 'approve' ? 'approved' : (currentDecision === 'reject' ? 'rejected' : item.status || 'pending');
                return { ...item, status: nextStatus };
              });
              render(nextItems);
              const logBox = document.getElementById('logBox');
              logBox.textContent = `${new Date().toLocaleTimeString()}：${decision === 'approve' ? '批准' : '拒绝'} 记录 ${id}，等待维护者更新 virus-db.json。`;
            });
        });
      });
    }

    function load() {
      fetch(remoteUrl)
        .then((response) => response.json())
        .then((data) => {
          const state = readState();
          const items = (data.signatures || []).map((entry, index) => {
            const id = entry.id || `sig-${index}`;
            const nextDecision = state[id];
            const status = nextDecision === 'approve' ? 'approved' : (nextDecision === 'reject' ? 'rejected' : (entry.status || 'pending'));
            return { ...entry, id, status };
          });
          render(items);
          document.getElementById('logBox').textContent = JSON.stringify({ source: remoteUrl, count: items.length }, null, 2);
        })
        .catch((error) => {
          document.getElementById('logBox').textContent = '无法加载远程病毒库：' + error;
        });
    }

    load();
  </script>
</body>
</html>
